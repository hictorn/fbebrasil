name: Blog FBE
on:
  pull_request:
    paths:
      - 'faculdade/**'
      - 'assets/fbe-mobile-navigation.*'
      - 'tools/blog/**'
      - 'tools/verify_navigation.py'
      - '.github/workflows/blog.yml'
      - 'robots.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rendered blog, links and SEO
        run: python3 tools/blog/verify.py
      - name: Verify admissions and graduation inquiry navigation
        run: python3 tools/verify_navigation.py
